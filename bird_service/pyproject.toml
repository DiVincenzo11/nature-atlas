[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nature-atlas-birds"
version = "0.2.0"
description = "YOLOv8 detector and EfficientNetV2 bird classification service"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "torchvision>=0.20,<1", "ultralytics>=8.3,<9", "Pillow>=10", "opencv-python>=4.8", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28"]

[project.scripts]
nature-birds = "nature_birds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
