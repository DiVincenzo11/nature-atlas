events { worker_connections 1024; }
http {
 include mime.types;
 server {
  listen 127.0.0.1:18901;
  server_name localhost;
  root /path/to/frontend/dist;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://127.0.0.1:18900/; }
  location /ws-chat { proxy_pass http://127.0.0.1:18900; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
 }
}
